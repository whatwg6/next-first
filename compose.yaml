# Local development services. Run the Next.js app with pnpm dev.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account_local
      POSTGRES_DB: account
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres_data:
